{% extends "base.html" %}
{% block title %}Contact | UrbanRoute Fleet{% endblock %}
{% block content %}
<section class="page-hero"><span class="eyebrow">CONTACT</span><h1>Let's talk about fleet operations.</h1><p>Share a question, idea or collaboration interest.</p></section>
<section class="section contact-wrap"><form class="contact-form" method="post"><label>Name<input required name="name" placeholder="Your name"></label><label>Email<input required type="email" name="email" placeholder="you@example.com"></label><label>Message<textarea required name="message" rows="5" placeholder="Tell us what you have in mind"></textarea></label><button class="btn primary" type="submit">Submit message</button><p class="muted">Demo form only. Message delivery is not connected.</p></form></section>
{% endblock %}
