<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UrbanRoute Fleet</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f4;--sf:#fff;--ink:#3b1220;--mute:#7a5560;--line:#f0d5d8;--red:#b4142f;--btn:#b4142f;--pink:#d6336c;--gold:#e0a820;--goldink:#7a5200;--ps:#fde4ec;--gs:#fbefc8;--rs:#fbdcdc;--ok:#166534;--oks:#dcf3e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0d12;--sf:#2a141b;--ink:#fbeaee;--mute:#c9a3ad;--line:#4a2530;--red:#ff7b8d;--btn:#d63350;--pink:#ff8fb1;--gold:#f5c542;--goldink:#f5c542;--ps:#4a1f2c;--gs:#40320f;--rs:#4a1a1e;--ok:#6ee7a0;--oks:#143a24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c0d12;--sf:#2a141b;--ink:#fbeaee;--mute:#c9a3ad;--line:#4a2530;--red:#ff7b8d;--btn:#d63350;--pink:#ff8fb1;--gold:#f5c542;--goldink:#f5c542;--ps:#4a1f2c;--gs:#40320f;--rs:#4a1a1e;--ok:#6ee7a0;--oks:#143a24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center;padding:4px 8px 14px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--pink) 55%,var(--red))}
nav button.n{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:600;color:var(--mute)}
nav button.n[aria-current=page]{background:var(--ps);color:var(--ink);box-shadow:inset 3px 0 var(--red)}
.mb{display:none}
main{padding:22px 26px;max-width:1180px;width:100%}
h1{font-size:25px;letter-spacing:-.02em;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--mute);margin:0 0 18px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.role{display:flex;gap:3px;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:3px}
.role button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:700;color:var(--mute)}
.role button[aria-pressed=true]{background:var(--btn);color:#fff}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:1fr 1fr;align-items:start}
.cnt{font-size:28px;font-weight:800;line-height:1.1}.mute{color:var(--mute);font-size:13px}
.bat{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.bat i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--pink),var(--gold))}
.badge{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--gs);color:var(--goldink)}
.b-ok{background:var(--oks);color:var(--ok)}.b-bad{background:var(--rs);color:var(--red)}.b-pink{background:var(--ps);color:var(--pink)}
.sim{font-size:12px;color:var(--goldink);background:var(--gs);border-radius:6px;padding:1px 7px;font-weight:700}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sf)}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:8px 14px;font-weight:700}
.btn.p{background:var(--btn);border-color:var(--btn);color:#fff}.btn.g{background:var(--gold);border-color:var(--gold);color:#3b1220}
.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-size:13px}
.msg{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.msg.ok{background:var(--oks);color:var(--ok)}.msg.err{background:var(--rs);color:var(--red)}.msg.warn{background:var(--gs);color:var(--goldink)}
.ins{border-left:5px solid var(--gold);padding:8px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}.ins.r{border-color:var(--red)}.ins.k{border-color:var(--pink)}
.empty{text-align:center;padding:22px;color:var(--mute)}
[hidden]{display:none!important}
.hh{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sf);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 6vw}
.hh nav{all:unset;display:flex;gap:18px;font-weight:600}.hh nav a{color:var(--mute);text-decoration:none}
.sec{padding:64px 6vw}.sec.alt{background:var(--sf);border-block:1px solid var(--line)}.wrap{max-width:1100px;margin:0 auto}
.sec h2{font-size:30px;letter-spacing:-.02em;margin:0 0 8px}.lead{color:var(--mute);max-width:60ch;margin:0 0 28px;font-size:16px}
.hero{background:linear-gradient(160deg,#2a0a14,#5a1022 55%,#8c1c3a);color:#fff;padding:56px 6vw 0;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.03em;margin:0 0 16px}
.hero p{color:#f6d9df;font-size:17px;max-width:46ch;margin:0 0 26px}
.hero svg{width:100%;height:auto;display:block;margin-bottom:-6px}
.cta{display:inline-block;border:0;border-radius:10px;padding:13px 24px;font-weight:800;font-size:16px;background:#f5c542;color:#3b1220;text-decoration:none}
.cta.o{background:none;color:#fff;border:1px solid #f6d9df;margin-left:8px}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.fg .card{margin:0;border-top:4px solid var(--gold)}.fg .card:nth-child(3n+2){border-top-color:var(--pink)}.fg .card:nth-child(3n){border-top-color:var(--red)}
.fg h3{margin:0 0 6px;font-size:17px}.fg p{margin:0;color:var(--mute)}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.steps b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3b1220;margin-bottom:8px}
.end{background:linear-gradient(160deg,#5a1022,#8c1c3a);color:#fff;text-align:center}.end p{color:#f6d9df;margin:0 auto 24px}
.foot{padding:20px 6vw;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.hh nav{display:none}.cta.o{margin:10px 0 0}}
@media(max-width:860px){.app{grid-template-columns:1fr}nav{display:none;position:static;height:auto}nav.open{display:block}.mb{display:block;margin:10px 16px 0}.two{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div id="home"></div>
<div class="app" id="app" hidden>
<nav id="nav" aria-label="Main"></nav>
<div><button class="btn mb" id="mb" aria-expanded="false">Menu</button><main id="m"></main></div>
</div>
<script>
(function(){
var KEYS={veh:"urbanroute_vehicles",sta:"urbanroute_stations",ses:"urbanroute_sessions",rou:"urbanroute_routes",res:"urbanroute_reservations",pas:"urbanroute_pass",txn:"urbanroute_txn",pref:"urbanroute_prefs",own:"urbanroute_owner"};
var D={},S={t:{td:"",tk:"",tr:"One way"},od:15,cc:{cf:20,ct:80,cb:"",cp:"",ck:50},view:"dash",draft:{name:"",vid:"",stops:[]},sel:null,q:"",f:"All",editV:null,editS:null,msg:null,plan:null,sim:null,disc:{vid:"",rad:15}};
function ld(k,d){try{var j=localStorage.getItem(KEYS[k]);return j?JSON.parse(j):d}catch(e){return d}}
var API=null;
function apiH(){return{"Content-Type":"application/json","X-Role":D.pref.role}}
function push(k){if(!API||k==="pref")return;
 fetch(API+"/api/state/"+k,{method:"PUT",headers:apiH(),body:JSON.stringify(D[k])}).then(function(r){if(!r.ok)return r.json().then(function(j){msg(j.error||"The server rejected this change.","err");pull()})}).catch(function(){})}
function pull(){if(!API)return;
 fetch(API+"/api/state",{headers:apiH()}).then(function(r){return r.json()}).then(function(st){for(var k in st){if(KEYS[k]&&k!=="pref"){D[k]=st[k];try{localStorage.setItem(KEYS[k],JSON.stringify(st[k]))}catch(e){}}}passes();if(!S.home)render()}).catch(function(){})}
function connect(){var q="";try{q=new URLSearchParams(location.search).get("api")||localStorage.getItem("urbanroute_api")||""}catch(e){}
 var c=[q,location.origin].filter(function(x){return x&&x.indexOf("http")===0}).map(function(x){return x.replace(/\/$/,"")});
 (function t(i){if(i>=c.length)return;fetch(c[i]+"/api/health").then(function(r){return r.json()}).then(function(j){if(j&&j.app==="urbanroute"){API=c[i];pull();if(!S.home)render()}else t(i+1)}).catch(function(){t(i+1)})})(0)}
function sv(k){push(k);try{localStorage.setItem(KEYS[k],JSON.stringify(D[k]));return true}catch(e){msg("Data could not be saved. Your work is still on screen.","err");return false}}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function msg(t,type){S.msg={t:t,type:type||"ok"}}
function uid(p){return p+Math.random().toString(36).slice(2,7)}
function nowH(){var d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);return d}
function loc(d){d=new Date(d);var z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,16)}
function fm(d){return new Date(d).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function seed(){
 var t=nowH();
 D.veh=[{id:"UR-101",name:"Tata Ace EV",kwh:21.3,cons:.14,pct:82,conn:"CCS2",status:"Available",lat:12.935,lng:77.614},
 {id:"UR-102",name:"Mahindra eSupro",kwh:15,cons:.13,pct:24,conn:"CCS2",status:"Available",lat:12.97,lng:77.64},
 {id:"UR-103",name:"Eicher Pro X",kwh:70,cons:.35,pct:55,conn:"CCS2",status:"On route",lat:12.99,lng:77.55},
 {id:"UR-104",name:"Piaggio Ape E-Xtra",kwh:7.4,cons:.09,pct:18,conn:"Type 2",status:"Available",lat:12.91,lng:77.6},
 {id:"UR-105",name:"Tata Ace EV 2",kwh:21.3,cons:.14,pct:91,conn:"CCS2",status:"Available",lat:12.95,lng:77.7},
 {id:"UR-106",name:"Mahindra Treo Zor",kwh:7.4,cons:.1,pct:35,conn:"Type 2",status:"Charging",lat:12.88,lng:77.63},
 {id:"UR-107",name:"Eicher Pro X 2",kwh:70,cons:.35,pct:12,conn:"CCS2",status:"Offline",lat:13.03,lng:77.59},
 {id:"UR-108",name:"Tata Ace EV 3",kwh:21.3,cons:.14,pct:64,conn:"CCS2",status:"Available",lat:12.92,lng:77.67}];
 D.sta=[{id:"ST-1",name:"Koramangala Hub",conn:"CCS2",kw:50,n:4,price:11,lat:12.934,lng:77.622},
 {id:"ST-2",name:"Whitefield Depot",conn:"CCS2",kw:60,n:3,price:10,lat:12.969,lng:77.75},
 {id:"ST-3",name:"Indiranagar Fast",conn:"CCS2",kw:120,n:2,price:19,lat:12.978,lng:77.64},
 {id:"ST-4",name:"HSR Layout Point",conn:"Type 2",kw:22,n:3,price:12,lat:12.912,lng:77.64},
 {id:"ST-5",name:"Hebbal Plaza",conn:"CCS2",kw:50,n:2,price:21,lat:13.035,lng:77.597},
 {id:"ST-6",name:"Jayanagar Type 2",conn:"Type 2",kw:22,n:2,price:12,lat:12.925,lng:77.583}];
 D.ses=[{id:"CS-1",vid:"UR-106",sid:"ST-4",start:t.toISOString(),target:90,mins:150,status:"Scheduled"}];
 D.rou=[{id:"RT-1",name:"North loop deliveries",vid:"UR-105",stops:[{n:"Depot",km:0},{n:"Hebbal drop",km:24},{n:"Yelahanka drop",km:12},{n:"Return",km:30}],km:66,kwh:9.2,stop:null,status:"Planned",at:new Date().toISOString()}];
 D.res=[{id:"RS-1",vid:"UR-101",sid:"ST-1",cn:1,start:new Date(t.getTime()+36e5).toISOString(),end:new Date(t.getTime()+72e5).toISOString(),status:"Confirmed"}];
 D.pas={};D.txn=[];D.pref={role:"Fleet Manager",last:"dash"};
 var dg=function(n){return new Date(Date.now()-n*864e5).toISOString()};
 D.own={car:{name:"Tata Nexon EV",kwh:40.5,cons:.15,pct:58,conn:"CCS2",tariff:7,lat:12.935,lng:77.614},log:[{id:"L1",at:dg(12),place:"Home",kwh:18,cost:126,type:"Home"},{id:"L2",at:dg(8),place:"Koramangala Hub",kwh:22,cost:242,type:"Public"},{id:"L3",at:dg(3),place:"Home",kwh:15,cost:105,type:"Home"}]};
 for(var k in KEYS)sv(k);
}
function init(){var ok=0;for(var k in KEYS){D[k]=ld(k,null);if(D[k]===null)ok=1}if(ok)seed();passes()}
function passes(){D.veh.forEach(function(v){if(!D.pas[v.id])D.pas[v.id]={id:"FP-"+v.id.slice(3),vid:v.id,status:"Active",plan:"Annual (demo)",bal:2000}})}
function mgr(){return D.pref.role==="Fleet Manager"}
function V(id){return D.veh.filter(function(v){return v.id===id})[0]}
function ST(id){return D.sta.filter(function(v){return v.id===id})[0]}
// ---- engine ----
function rangeKm(v){return v.kwh*v.pct/100/v.cons}
function calc(r,v){
 var cum=0,avail=v.kwh*v.pct/100,legs=r.stops.map(function(s){cum+=s.km;var left=(avail-cum*v.cons)/v.kwh*100;return{n:s.n,km:s.km,kwh:s.km*v.cons,pct:left,ok:left>=10}});
 var energy=cum*v.cons,short=Math.max(0,energy+v.kwh*.1-avail);
 return{km:cum,kwh:energy,arr:(avail-energy)/v.kwh*100,ok:short===0,short:short,legs:legs}}
function hav(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(q))}
function est(st){ // simulated, stable per 10-minute bucket
 var b=Math.floor(Date.now()/6e5),h=0,s=st.id+b;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%9973;
 var free=h%(st.n+1),wait=free?0:8+h%22,prob=84+h%15,soon=free>0||h%3>0;
 return{free:free,wait:wait,prob:prob,soon:soon,upd:new Date(b*6e5).toISOString()}}
function compat(v){return D.sta.filter(function(s){return s.conn===v.conn})}
function rank(v,rad){return compat(v).map(function(s){var d=hav(v.lat,v.lng,s.lat,s.lng),e=est(s);return{s:s,d:d,e:e,score:d*1.5+e.wait+(100-e.prob)*.5}}).filter(function(x){return x.d<=rad}).sort(function(a,b){return a.score-b.score})}
function mins(v,s,from,to){return Math.ceil((to-from)/100*v.kwh/s.kw*60)}
function overlap(a,b,c,d){return a<d&&c<b}
function load(sid,a,b,skip){var n=0;D.ses.forEach(function(x){if(x.sid===sid&&x.status==="Scheduled"&&overlap(+new Date(x.start),+new Date(x.start)+x.mins*6e4,a,b))n++});
 D.res.forEach(function(x){if(x.sid===sid&&x.status==="Confirmed"&&x.id!==skip&&overlap(+new Date(x.start),+new Date(x.end),a,b))n++});return n}
function nextFree(s,a,len){for(var t=a;t<a+864e5;t+=9e5)if(load(s.id,t,t+len)<s.n)return t;return null}
function needs(){return D.veh.filter(function(v){return v.status!=="Offline"&&v.status!=="Charging"&&v.pct<40})}
function urgent(vid){return D.rou.some(function(r){return r.vid===vid&&r.status==="Planned"})}
function coord(list,stas,start,H){
 var load={},out=[],un=[];
 list.slice().sort(function(a,b){return(100-b.pct+(b.urg?30:0))-(100-a.pct+(a.urg?30:0))}).forEach(function(v){
  var cs=stas.filter(function(s){return s.conn===v.conn}).sort(function(a,b){return hav(v.lat,v.lng,a.lat,a.lng)-hav(v.lat,v.lng,b.lat,b.lng)}),done=0;
  for(var h=0;h<H&&!done;h++)for(var i=0;i<cs.length&&!done;i++){var k=cs[i].id+h;if((load[k]||0)<cs[i].n){load[k]=(load[k]||0)+1;out.push({v:v,s:cs[i],h:h});done=1}}
  if(!done)un.push(v)});
 return{out:out,un:un}}
// ---- views ----
var NAVS={"Fleet Manager":[["dash","Fleet overview"],["veh","Vehicles"],["sta","Charging stations"],["coord","Fleet coordination"],["pass","FleetPass"],["hist","History and reports"],["about","About and help"]],
"Dispatcher":[["dispatch","Dispatch board"],["plan","Route planner"],["ses","Charging scheduler"],["disc","Station finder"],["resv","Reservations"],["hist","History"],["about","About and help"]],
"EV Owner":[["mycar","My car"],["trip","Trip check"],["chargers","Find chargers"],["guide","Charging guide"],["log","Charging log"],["about","About and help"]]};
var DEF={"Fleet Manager":"dash","Dispatcher":"dispatch","EV Owner":"mycar"};
function bat(p){return '<div class="bat" aria-hidden="true"><i style="width:'+Math.max(2,p)+'%"></i></div>'}
function stb(s){var c=s==="Available"?"b-ok":s==="Offline"?"b-bad":s==="On route"?"":"b-pink";return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function lbl(){return '<span class="sim">Simulated estimate</span>'}
function fld(l,n,t,val,x){return '<label for="f_'+n+'">'+l+'</label><input id="f_'+n+'" name="'+n+'" type="'+(t||"text")+'" value="'+esc(val==null?"":val)+'" '+(x||"")+'>'}
function sel(l,n,opts,val){return '<label for="f_'+n+'">'+l+'</label><select id="f_'+n+'" name="'+n+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?" selected":"")+'>'+esc(o[1])+'</option>'}).join("")+'</select>'}
function vopts(){return D.veh.map(function(v){return[v.id,v.id+" · "+v.name+" ("+v.pct+"%)"]})}
function lock(){return mgr()?"":" disabled"}
function guard(){return mgr()?"":'<p class="mute">Switch to Fleet manager to change this. Dispatchers can view only.</p>'}
function dash(){
 var c={};D.veh.forEach(function(v){c[v.status]=(c[v.status]||0)+1});
 var low=needs(),risk=D.rou.filter(function(r){var v=V(r.vid);return r.status==="Planned"&&v&&!calc(r,v).ok}),slow=D.sta.filter(function(s){return est(s).wait>=15}),idle=D.veh.filter(function(v){return v.status==="Available"}).length;
 var ins=[];
 if(risk.length)ins.push(['r',risk.length+" planned route"+(risk.length>1?"s":"")+" may not finish","The assigned vehicle's range is below the route energy plus a 10% reserve. Reassign or add a charging stop."]);
 if(low.length)ins.push(['r',low.length+" vehicle"+(low.length>1?"s":"")+" below 40% battery",low.map(function(v){return v.id+" ("+v.pct+"%)"}).join(", ")+". See Fleet coordination for a proposed charging plan."]);
 if(slow.length)ins.push(['',slow.length+" station"+(slow.length>1?"s have":" has")+" an estimated wait over 15 minutes",slow.map(function(s){return s.name}).join(", ")+". Estimates are simulated."]);
 var exp=D.sta.filter(function(s){return s.price>=18}).length;if(exp)ins.push(['k',exp+" stations charge ₹18 or more per kWh","Compare with cheaper compatible stations in Station finder before sending vehicles."]);
